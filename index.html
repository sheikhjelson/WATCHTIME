<div class="yt-premium-embed-container">
    <!-- 
      - ://youtube.com: Used for valid user session and login detection (Best for Watchtime)
      - enablejsapi=1: Keeps communication open between browser and YT to verify human activity
      - rel=0 & modestbranding=1: Keeps the player clean and professional
    -->
    <iframe 
        src="https://://youtube.com/embed/UFVI22yd-Oc?si=L0HgDu7PqjOaUcZt?rel=0&modestbranding=1&controls=1&enablejsapi=1" 
        title="YouTube Official Video Player" 
        loading="lazy" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        allowfullscreen>
    </iframe>
</div>

<style>
    /* Top-tier responsive 16:9 player styling */
    .yt-premium-embed-container {
        position: relative;
        width: 100%;
        max-width: 850px; /* Isko aap kam ya zyada kar sakty hain */
        margin: 25px auto;
        aspect-ratio: 16 / 9;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        background-color: #000; /* Black background till video loads */
    }

    .yt-premium-embed-container iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: 0;
    }
</style>
